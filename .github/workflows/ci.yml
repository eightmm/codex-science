name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify runtime cachebuster against base commit
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_release.py --base-ref "$BASE_REF"

  check:
    needs: release-gate
    # Keep the existing required matrix contexts authoritative. A skipped job can
    # satisfy branch protection, so propagate a failed gate as a real matrix
    # failure instead of skipping these jobs.
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Require release gate
        env:
          RELEASE_GATE_RESULT: ${{ needs.release-gate.result }}
        run: test "$RELEASE_GATE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run complete fast verification
        run: ./scripts/check.sh fast
